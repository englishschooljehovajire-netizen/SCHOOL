<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJES Student Admission Form 2026-27</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Arial', sans-serif;
  background: #f2f4f7;
  padding: 20px;
  text-align: center;
}
.form-container {
  max-width: 750px;
  margin: 20px auto;
  background: white;
  padding: 35px;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}
.header img { width: 100px; border-radius: 50%; margin-bottom: 12px; border: 3px solid #0d3b66; }
.header h1 { color: #0d3b66; font-size: 24px; margin-bottom: 5px; }
.header p { color: #666; margin-bottom: 25px; }

.section-title {
  background: #0d3b66;
  color: white;
  padding: 10px;
  border-radius: 8px;
  margin: 25px 0 15px 0;
  font-size: 17px;
  text-align: center;
}
.form-group { margin-bottom: 18px; text-align: left; }
label { 
  display: block; 
  font-weight: bold; 
  margin-bottom: 8px; 
  color: #333;
  font-size: 15px;
}
input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: #0d3b66; }
.row { display: flex; gap: 15px; }
.row .form-group { flex: 1; }

.btn {
  background: #ffc107;
  color: #000;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  width: 100%;
  cursor: pointer;
  margin-top: 20px;
  transition: 0.3s;
}
.btn:hover { background: #ffdb4d; transform: translateY(-2px); }

.note { font-size: 12px; color: #d32f2f; margin-top: 5px; }
@media(max-width:600px){ .row{flex-direction:column;} }
</style>
</head>
<body>

<div class="form-container">
  <div class="header">
    <h1>Jehova Jire English School</h1>
    <p>Student Admission Form 2026-27 | Pangbalkawn, Kolasib</p>
  </div>

  <form onsubmit="window.print(); alert('Form print/download a ni tawh. Office ah document nen submit rawh'); return false;">
    
    <div class="section-title">Student Details</div>
    <div class="form-group">
      <label>Student (Full Name) *</label>
      <input type="text" name="student_name" placeholder="Ex: Lalmuanpuia" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Date of Birth *</label>
        <input type="date" name="dob" required>
      </div>
      <div class="form-group">
        <label>Class Applying For *</label>
        <select name="class" required>
          <option value="">Select Class</option>
          <option>Nursery</option><option>LKG</option><option>UKG</option>
          <option>Class 1</option><option>Class 2</option><option>Class 3</option>
          <option>Class 4</option><option>Class 5</option><option>Class 6</option>
          <option>Class 7</option><option>Class 8</option>
        </select>
      </div>
    </div>
     <div class="form-group">
        <label>PAN No</label>
        <input type="text" name="pan" maxlength="10" placeholder="Ex: ABCDE1234F">
        <p class="note">Optional: 10 character</p>
      </div>
    </div>

    <div class="section-title">Parents / Guardians Details</div>
    <div class="form-group">
      <label>Parents/Guardians Name *</label>
      <input type="text" name="parent_name" placeholder="Ex: Father: R. Lalnunmawia, Mother: Lalhmingliani" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Contact No. *</label>
        <input type="tel" name="contact" placeholder="Ex: 96123 56076" maxlength="10" required>
      </div>
     
    <div class="section-title">Other Details</div>
    <div class="form-group">
      <label>Address *</label>
      <textarea name="address" rows="3" placeholder="Ex: Pangbalkawn, Kolasib, Mizoram - 796081" required></textarea>
    </div>

    <div class="form-group">
      <label>Previous School</label>
      <input type="text" name="prev_school" placeholder="Ex: Govt. Primary School, Kolasib">
    </div>

    <button type="submit" class="btn">Print / Download Form</button>
    <p class="note" style="text-align:center; margin-top:10px; color:#555;">Note: He form hi print la, document nen school office ah submit rawh</p>
  </form>
</div>

</body>
</html>
