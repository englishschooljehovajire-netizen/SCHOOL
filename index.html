<title>Jehova Jire English School - JJES</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('school-bg.jpg') no-repeat center fixed;
  background-size: cover;
}
.header {
  text-align: center;
  padding: 40px 20px;
  background: rgba(0,0,0,0.6);
  color: white;
}
.logo { 
  width: 120px; 
  border: 4px solid white; 
  border-radius: 50%; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
  background: white;
  padding: 5px;
}
h1 { margin: 10px 0 5px 0; font-size: 28px; }
.subtitle { font-style: italic; }
.btn {
  display: inline-block;
  background: #ffcc00;
  color: black;
  padding: 12px 25px;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  margin: 8px;
  transition: 0.3s;
}
.btn:hover { background: #ffdb4d; transform: scale(1.05); }

.container {
  background: #f5f5f5;
  padding: 40px 20px;
}
.section-title {
  text-align: center;
  color: #003366;
  font-size: 26px;
  margin-bottom: 30px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1100px;
  margin: 0 auto;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border-top: 4px solid #003366;
}
.card h3 { color: #003366; margin-top: 0; }
.card ul { padding-left: 20px; }
.card a { color: #0066cc; text-decoration: none; }
.footer {
  text-align:center; 
  background:#222; 
  color:white; 
  padding:20px;
}
</style>
</head>
