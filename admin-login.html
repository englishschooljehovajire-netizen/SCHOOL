<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Administrator Login - JJES</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0e3d6b;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.box{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.logo{width:80px;height:80px;border-radius:50%;border:3px solid #0e3d6b;object-fit:cover;margin-bottom:10px}
h3{color:#0e3d6b;font-size:18px}p{font-size:11px;color:#666;margin:6px 0 16px}
input{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:13px;outline:none;margin-bottom:10px}
.btn{width:100%;padding:12px;background:#0e3d6b;color:#ffc107;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn.green{background:#0a8a3a;color:#fff}
.note{font-size:11px;background:#f1f5ff;color:#0e3d6b;padding:8px;border-radius:6px;margin:10px 0}
</style>
</head>
<body>
<div class="box">
<img src="logo.jpg" class="logo"><h3>🔐 School Administrator</h3>
<input id="mob" type="tel" maxlength="10" value="" placeholder="">
<button class="btn" id="sendBtn" onclick="sendOTP()">Send OTP</button>
<div id="otpBox" style="display:none">
<div class="note">OTP: <b id="showOtp">------</b> <br>Allowed: 9612356076 only</div>
<input id="otp" type="text" maxlength="6" placeholder="Enter 6-digit OTP">
<button class="btn green" onclick="verifyOTP()">Verify & Login</button>
</div>
</div>
<script>
const ALLOWED="9612356076";let genOTP="";
function sendOTP(){
 let m=document.getElementById('mob').value.trim();
 if(m!==ALLOWED){alert('He number hi a dik lo! '+ALLOWED+' chauh');return;}
 genOTP=Math.floor(100000+Math.random()*900000).toString();
 document.getElementById('showOtp').innerText=genOTP;
 document.getElementById('otpBox').style.display='block';
 document.getElementById('sendBtn').innerText='Resend OTP';
}
function verifyOTP(){
 let o=document.getElementById('otp').value.trim();
 if(o===genOTP && o!==""){
  localStorage.setItem('jjes_admin','true');
  location.href='admin-dashboard.html';
 }else{alert('OTP dik lo! '+genOTP);}
}
</script>
</body>
</html>
