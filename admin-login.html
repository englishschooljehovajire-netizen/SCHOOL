<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Administrator Login - JJES</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0e3d6b;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.box{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.logo{width:80px;height:80px;border-radius:50%;border:3px solid #0e3d6b;object-fit:cover;margin-bottom:10px}
h3{color:#0e3d6b;font-size:18px}p{font-size:11px;color:#666;margin:6px 0 16px}
.input-wrap{position:relative;margin-bottom:10px}
.input-wrap input{width:100%;padding:12px 40px 12px 12px;border:1px solid #bbb;border-radius:8px;font-size:13px;outline:none}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:14px;color:#666}
.btn{width:100%;padding:12px;background:#0e3d6b;color:#ffc107;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:10px;color:#900;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<img src="logo.jpg" class="logo" onerror="this.style.display='none'">
<h3>🔐 School Administrator</h3>
<p>JEHOVA JIRE English School, Pangbalkawn</p>

<div class="input-wrap">
<input id="mob" type="tel" maxlength="10">
</div>

<div class="input-wrap">
<input id="pwd" type="password" placeholder="Enter Password">
<span class="eye" onclick="togglePwd()">👁️</span>
</div>

<button class="btn" id="loginBtn" onclick="login()">Login</button>
<p style="font-size:10px;margin-top:8px;color:#666">Attempt: <span id="attempt">0</span>/5</p>
</div>

<script>
const ALLOWED_MOBILE = "9612356076";
// Password hash - security atan - Hei hi "Timothy@1990" hash a ni
// I password duh chu he function hmangin hash la rawh: hashPass("i password")
function hashPass(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%1000000007;}return h.toString();}
const ALLOWED_PASS_HASH = hashPass("Timothy@1990"); // Password: Timothy@1990 - i duh chuan thlak rawh

let attempts = 0;
let blockedUntil = 0;

function togglePwd(){
 let p=document.getElementById('pwd');
 p.type = p.type==='password' ? 'text' : 'password';
}

function login(){
 if(Date.now() < blockedUntil){
   let sec = Math.ceil((blockedUntil-Date.now())/1000);
   alert(`Blocked! ${sec}s nghak rawh`);
   return;
 }
 let m=document.getElementById('mob').value.trim();
 let p=document.getElementById('pwd').value;

 if(m!==ALLOWED_MOBILE){alert('Mobile dik lo! '+ALLOWED_MOBILE+' chauh');return;}
 if(!p){alert('Password chhu rawh');return;}

 attempts++;
 document.getElementById('attempt').innerText=attempts;

 if(hashPass(p)===ALLOWED_PASS_HASH){
   localStorage.setItem('jjes_admin','true');
   localStorage.setItem('jjes_admin_time',Date.now().toString());
   location.replace('admin-dashboard.html');
 }else{
   alert(`Password dik lo! Attempt ${attempts}/5`);
   if(attempts>=5){
     blockedUntil = Date.now()+60000; // 1 min block
     document.getElementById('loginBtn').disabled=true;
     setTimeout(()=>{document.getElementById('loginBtn').disabled=false;attempts=0;document.getElementById('attempt').innerText='0';},60000);
     alert('Attempt 5 a pel - 1 minute block a ni e');
   }
 }
}
</script>
</body>
</html>
